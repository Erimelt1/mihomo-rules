# Mihomo classical rule provider: Windows game processes routed DIRECT.
#
# Inclusion policy:
# - use exact process names tied to a confirmed game or an existing local rule;
# - keep this file process-only; domains and IPs belong to separate providers;
# - avoid shared runtimes, generic anti-cheats, and engine-wide wildcards.
#
# Owner-approved EST baseline (2026-11-05): 20 reviewed exact names from the
# previous candidate plus Deadlock and ARC Raiders, 22 rules total.
# Reviewed source reference (2026-10-16):
# https://raw.githubusercontent.com/legiz-ru/mihomo-rule-sets/main/other/games-direct.yaml

